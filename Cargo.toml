[workspace]
members = [
    "crates/app_root",
    "crates/hosh_hosh_ui_dioxus",
    "crates/prelude",
    "crates/style/simple",
]
resolver = "3"

[workspace.dependencies]
# internal crates
hosh_hosh_ui_dioxus.path = "crates/hosh_hosh_ui_dioxus"
prelude.path = "crates/prelude"
style_simple.path = "crates/style/simple"

# external out the domain
dioxus = { features = ["router"], version = "0.7.10" }

[profile.dev.package."*"]
debug = true
opt-level = 0

[profile.test.package."*"]
opt-level = 0
